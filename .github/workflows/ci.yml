name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — hackathon CI minutes are finite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: format · lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      # Typecheck runs before lint deliberately. Typed linting resolves
      # workspace imports through each package's built declarations, so on a
      # clean checkout `dist` must exist first — otherwise cross-package types
      # come back unresolved and surface as confusing no-unsafe-* lint errors
      # rather than as the type errors they are. `pnpm run lint` also builds
      # for this reason; the ordering here is so failures are reported by the
      # step that actually owns them.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
